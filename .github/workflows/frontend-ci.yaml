name: Frontend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - starter/frontend/**
  workflow_dispatch:

jobs:
  check_style:
    name: Check frontend style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Prepare Node environment
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        run: npm ci

      - name: Check lint rules
        run: npm run lint

  verify_tests:
    name: Verify frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Prepare Node environment
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        run: npm ci

      - name: Execute test suite
        run: npm test
        env:
          CI: true

  container_build:
    name: Build frontend container
    runs-on: ubuntu-latest
    needs:
      - check_style
      - verify_tests

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Prepare Node environment
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        run: npm ci

      - name: Re-run frontend tests before image build
        run: npm test
        env:
          CI: true

      - name: Create frontend container image
        env:
          MOVIE_API_URL: http://localhost:5000
        run: |
          docker build \
            --build-arg "REACT_APP_MOVIE_API_URL=${MOVIE_API_URL}" \
            --tag mp-frontend:ci \
            .
