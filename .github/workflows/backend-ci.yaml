name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

jobs:
  quality_check:
    name: Check backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install project dependencies
        run: pipenv install --dev

      - name: Run Flake8
        run: pipenv run lint

  test_suite:
    name: Run backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install project dependencies
        run: pipenv install --dev

      - name: Execute pytest
        run: pipenv run test

  container_check:
    name: Build backend container
    runs-on: ubuntu-latest
    needs:
      - quality_check
      - test_suite

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Build backend Docker image
        working-directory: starter/backend
        run: docker build --tag mp-backend:ci .
