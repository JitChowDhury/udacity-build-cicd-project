name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: cluster
  REPOSITORY: backend

jobs:
  lint_backend:
    name: Validate backend lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install backend dependencies
        run: pipenv install --dev

      - name: Run Flake8
        run: pipenv run lint

  test_backend:
    name: Validate backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install backend dependencies
        run: pipenv install --dev

      - name: Run pytest
        run: pipenv run test

  release_backend:
    name: Build publish and deploy backend
    runs-on: ubuntu-latest

    needs:
      - lint_backend
      - test_backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS access
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Sign in to Amazon ECR
        id: registry
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend image
        working-directory: starter/backend
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}" \
            .

      - name: Push backend image
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${CLUSTER_NAME}"

      - name: Update backend deployment
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl apply -k starter/backend/k8s

          kubectl set image deployment/backend \
            backend="${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}"

      - name: Wait for backend rollout
        run: |
          kubectl rollout status deployment/backend --timeout=180s

      - name: Verify backend pod
        run: |
          kubectl get deployment backend
          kubectl get pods -l app=backend
